name: V4 Mixed Media Store JVM
on:
  push:
    paths:
      - 'source/g1-shared-workflow/**'
      - '.github/workflows/v4-mixed-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify offline mixed-media recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac --release 17 -d "$RUNNER_TEMP/classes" source/g1-shared-workflow/src/com/parkarsite/g1/workflow/MixedMediaRecoveryStore.java source/g1-shared-workflow/selftest/com/parkarsite/g1/workflow/MixedMediaRecoverySelfTest.java
          java -cp "$RUNNER_TEMP/classes" com.parkarsite.g1.workflow.MixedMediaRecoverySelfTest
