name: Build K G1 G6A Cyan P2P State Diagnostic v0.6.8.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Safety audit
        working-directory: source/v0.6.8.5
        run: chmod +x SAFETY_AUDIT.sh RED_TEAM_AUDIT.sh && ./SAFETY_AUDIT.sh
      - name: Red-team static audit
        working-directory: source/v0.6.8.5
        run: ./RED_TEAM_AUDIT.sh
      - name: Host-JVM safety-policy and state-machine structural regression checks
        working-directory: source/v0.6.8.5
        run: bash STATE_MACHINE_AUDIT.sh
      - name: Compile and lint
        working-directory: source/v0.6.8.5
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug
      - name: Verify and stage exact build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g6a685"
          APK="$RUNNER_TEMP/g6a685/K_G1_G6A_Cyan_P2P_State_Diagnostic_v0_6_8_5.apk"
          cp source/v0.6.8.5/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp source/v0.6.8.5/app/build/reports/lint-results-debug.html "$RUNNER_TEMP/g6a685/lint-results-debug.html"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          git archive --format=zip --output="$RUNNER_TEMP/g6a685/K_G1_G6A_Cyan_P2P_State_Diagnostic_v0_6_8_5_source_exact.zip" "$GITHUB_SHA" source/v0.6.8.5
      - name: Archive immutable exact-build bundle
        run: bash tools/archive_verified_build_v0.6.8.5.sh
      - uses: actions/upload-artifact@v4
        with:
          name: K_G1_G6A_Cyan_P2P_State_Diagnostic_v0_6_8_5_${{ github.run_id }}
          path: releases/v0.6.8.5/builds/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/**
          if-no-files-found: error

# clean-rebuild-after-archive-fix
