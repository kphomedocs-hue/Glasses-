name: Repository Hygiene

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Public repository hygiene
        shell: bash
        run: bash tools/repo_hygiene.sh
