name: Site Capture Offline Production-Facing JVM
on:
  push:
    paths:
      - 'apps/site-capture/**'
      - 'source/g1-shared-workflow/src/**'
      - '.github/workflows/site-capture-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run zero-transfer app facade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-site-capture-classes"
          javac --release 17 -d "$RUNNER_TEMP/offline-site-capture-classes" \
            source/g1-shared-workflow/src/com/parkarsite/g1/workflow/MixedMediaRecoveryStore.java \
            apps/site-capture/src/main/java/com/parkarsite/g1/sitecapture/SiteCaptureOfflineCore.java \
            apps/site-capture/src/test/java/com/parkarsite/g1/sitecapture/OfflineCoreSelfTest.java
          java -cp "$RUNNER_TEMP/offline-site-capture-classes" com.parkarsite.g1.sitecapture.OfflineCoreSelfTest
          if grep -REn 'java[.]net[.]|android[.]bluetooth|WifiP2p|HttpURLConnection|\.streamOnce\(|\.writeOnce\(' apps/site-capture/src/main; then
            echo 'Unsafe source or media/network transfer in production offline facade' >&2
            exit 1
          fi
          echo 'PASS: production-facing facade has no transfer transport'
