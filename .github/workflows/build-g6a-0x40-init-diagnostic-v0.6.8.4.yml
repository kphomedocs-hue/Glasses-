name: Build K G1 G6A 0x40 Initialization Credential Diagnostic v0.6.8.4
on:
  workflow_dispatch:
  push:
    paths:
      - "source/v0.6.8.4/**"
      - ".github/workflows/build-g6a-0x40-init-diagnostic-v0.6.8.4.yml"
      - "tools/archive_verified_build_v0.6.8.4.sh"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Safety audit
        working-directory: source/v0.6.8.4
        run: chmod +x SAFETY_AUDIT.sh RED_TEAM_AUDIT.sh && ./SAFETY_AUDIT.sh
      - name: Red-team static audit
        working-directory: source/v0.6.8.4
        run: ./RED_TEAM_AUDIT.sh
      - name: Compile and lint
        working-directory: source/v0.6.8.4
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug
      - name: Verify and stage exact build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g6a684"
          APK="$RUNNER_TEMP/g6a684/K_G1_G6A_0x40_Initialization_Credential_Diagnostic_v0_6_8_4.apk"
          cp source/v0.6.8.4/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp source/v0.6.8.4/app/build/reports/lint-results-debug.html "$RUNNER_TEMP/g6a684/lint-results-debug.html"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          git archive --format=zip --output="$RUNNER_TEMP/g6a684/K_G1_G6A_0x40_Initialization_Credential_Diagnostic_v0_6_8_4_source_exact.zip" "$GITHUB_SHA" source/v0.6.8.4
      - name: Archive immutable exact-build bundle
        run: bash tools/archive_verified_build_v0.6.8.4.sh
      - uses: actions/upload-artifact@v4
        with:
          name: K_G1_G6A_0x40_Initialization_Credential_Diagnostic_v0_6_8_4_${{ github.run_id }}
          path: releases/v0.6.8.4/builds/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/**
          if-no-files-found: error
