name: Build K G1 P2P Association Probe v0.4.0
on:
  workflow_dispatch:
  push:
    paths:
      - "source/v0.4.0/**"
      - ".github/workflows/build-g4a-p2p-association-v0.4.0.yml"
      - "tools/archive_verified_build_v0.4.0.sh"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.6.0" }
      - name: Verify G4A scope
        shell: bash
        working-directory: source/v0.4.0
        run: |
          set -euo pipefail
          chmod +x SAFETY_AUDIT.sh
          ./SAFETY_AUDIT.sh
      - name: Compile and lint
        shell: bash
        working-directory: source/v0.4.0
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug
      - name: Verify APK signature
        shell: bash
        working-directory: source/v0.4.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g4a"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/g4a/K_G1_P2P_Association_Probe_v0_4_0.apk"
          cp app/build/reports/lint-results-debug.html "$RUNNER_TEMP/g4a/lint-results-debug.html"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/g4a/K_G1_P2P_Association_Probe_v0_4_0.apk"
          sha256sum "$RUNNER_TEMP/g4a/K_G1_P2P_Association_Probe_v0_4_0.apk"
      - name: Archive verified build
        shell: bash
        run: bash tools/archive_verified_build_v0.4.0.sh
      - uses: actions/upload-artifact@v4
        with:
          name: K_G1_P2P_Association_Probe_v0_4_0
          path: releases/v0.4.0/**
          if-no-files-found: error
