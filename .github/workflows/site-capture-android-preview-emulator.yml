name: K Site Capture Read-Only API36 UI Emulator
on:
  push:
    paths:
      - 'apps/site-capture/**'
      - 'source/g1-shared-workflow/src/**'
      - '.github/workflows/site-capture-android-preview-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  virtual-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Mandatory no-permissions manifest source preflight
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=apps/site-capture/android-preview/app/src/main/AndroidManifest.xml
          if grep -Eqi '<uses-permission|<uses-feature' "$MANIFEST"; then exit 1; fi
          grep -Fq 'applicationId = "com.parkarsite.g1.readonlypreview"' apps/site-capture/android-preview/app/build.gradle.kts
          if grep -REn 'WifiP2pManager|BluetoothGatt|java[.]net[.]|HostFixturePermit|OneShotByteSource' apps/site-capture/src/main apps/site-capture/android-preview/app/src/main/java; then exit 1; fi
          echo 'PASS: read-only preview source lacks hardware and fixture transfer capability'
      - name: KVM single AVD
        shell: bash
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Validate visible UI in one API36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/site-capture/android-preview
          script: bash run_emulator_ui_preview.sh
      - name: Never release a physical-test APK
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'G6A.*OPEN' LATEST_CHECKPOINT.md
          grep -q 'G6B.*BLOCKED' LATEST_CHECKPOINT.md
          echo 'PASS: no physical test, production sync blocked'
# No uploaded APK artifacts. Only an ephemeral preview APK on GitHub virtual Android.
