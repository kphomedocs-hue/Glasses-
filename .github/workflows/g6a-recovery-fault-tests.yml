name: G6A Offline Recovery Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/g6a-recovery-core/**'
      - '.github/workflows/g6a-recovery-fault-tests.yml'
permissions:
  contents: read
jobs:
  fault-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check no Android runtime dependencies
        run: |
          set -euo pipefail
          if grep -RniE 'import android\.|WifiP2pManager|BluetoothGatt|HttpURLConnection|java\.net\.' source/g6a-recovery-core/src; then
            exit 1
          fi
      - name: Offline fault injection and restart tests
        run: bash source/g6a-recovery-core/run_selftest.sh
