name: Build K G1 G6A Persistent Import Restart Receipt v0.6.8
on:
  workflow_dispatch:
  push:
    paths:
      - "source/v0.6.8/**"
      - ".github/workflows/build-g6a-persistent-import-v0.6.8.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Safety audit
        working-directory: source/v0.6.8
        run: chmod +x SAFETY_AUDIT.sh RED_TEAM_AUDIT.sh && ./SAFETY_AUDIT.sh
      - name: Red-team static audit
        working-directory: source/v0.6.8
        run: ./RED_TEAM_AUDIT.sh
      - name: Compile and lint
        working-directory: source/v0.6.8
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug
      - name: Verify and stage exact build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g6a68"
          APK="$RUNNER_TEMP/g6a68/K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8.apk"
          cp source/v0.6.8/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp source/v0.6.8/app/build/reports/lint-results-debug.html "$RUNNER_TEMP/g6a68/lint-results-debug.html"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          git archive --format=zip --output="$RUNNER_TEMP/g6a68/K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8_source_exact.zip" "$GITHUB_SHA" source/v0.6.8
          cd "$RUNNER_TEMP/g6a68"
          sha256sum K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8.apk > K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8_APK_SHA256.txt
          sha256sum K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8_source_exact.zip > K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8_source_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: K_G1_G6A_Persistent_Import_Restart_Receipt_v0_6_8_${{ github.run_id }}
          path: ${{ runner.temp }}/g6a68/**
          if-no-files-found: error
